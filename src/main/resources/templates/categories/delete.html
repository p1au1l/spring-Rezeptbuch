<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Kategorie löschen')}">
    <title>Kategorie löschen</title>
</head>
<body>
<div class="container py-4 py-lg-5">
    <div th:replace="~{fragments/layout :: siteHeader('Kategorie löschen')}"></div>

    <div class="card shadow-sm border-danger">
        <div class="card-body p-4 p-md-5">
            <div class="alert alert-danger mb-4" role="alert">
                <strong>Achtung:</strong> Diese Kategorie wird dauerhaft gelöscht.
            </div>

            <p class="mb-2 text-muted">Wirklich löschen?</p>
            <h2 class="h4 fw-bold mb-3" th:text="${category.name}">Kategorie</h2>
            <p class="mb-0">ID: <span class="fw-semibold" th:text="${category.id}"></span></p>

            <form class="d-flex flex-wrap gap-3 mt-4" th:action="@{/categories/{id}/delete(id=${category.id})}" method="post">
                <button type="submit" class="btn btn-danger">Ja, endgültig löschen</button>
                <a class="btn btn-outline-secondary" th:href="@{/categories/{id}(id=${category.id})}">Nein, abbrechen</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
