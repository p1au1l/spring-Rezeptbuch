<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${isEdit} ? 'Kategorie bearbeiten' : 'Kategorie anlegen')}"></head>
<body>
<div class="container py-4 py-lg-5">
    <div th:replace="~{fragments/layout :: siteHeader(${isEdit} ? 'Kategorie bearbeiten' : 'Kategorie anlegen')}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
            <form th:object="${category}"
                  th:action="${isEdit} ? @{/categories/{id}/edit(id=${category.id})} : @{/categories/new}"
                  method="post">

                <div class="row g-4">
                    <div class="col-12 col-lg-8">
                        <label for="name" class="form-label fw-semibold">Name *</label>
                        <input type="text"
                               id="name"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''"
                               th:field="*{name}">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="col-12">
                        <label for="description" class="form-label fw-semibold">Beschreibung</label>
                        <textarea id="description" class="form-control" th:field="*{description}" rows="5"></textarea>
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-3 mt-4">
                    <button type="submit" class="btn btn-success btn-lg">Speichern</button>
                    <a class="btn btn-outline-secondary btn-lg" th:href="${isEdit} ? @{/categories/{id}(id=${category.id})} : @{/categories}">Abbrechen</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
