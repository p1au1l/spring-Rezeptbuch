<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kategorien</title>
</head>
<body>
<div th:replace="~{fragments/layout :: siteHeader('Kategorien')}"></div>
<div th:replace="~{fragments/layout :: flashMessages(${successMessage}, ${errorMessage})}"></div>

<p>
    <a th:href="@{/categories/new}">Neue Kategorie anlegen</a>
</p>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Beschreibung</th>
        <th>Aktionen</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(categories)}">
        <td colspan="4">Es sind noch keine Kategorien vorhanden.</td>
    </tr>
    <tr th:each="category : ${categories}">
        <td th:text="${category.id}"></td>
        <td th:text="${category.name}"></td>
        <td th:text="${category.description}"></td>
        <td>
            <a th:href="@{/categories/{id}(id=${category.id})}">Details</a>
            |
            <a th:href="@{/categories/{id}/edit(id=${category.id})}">Bearbeiten</a>
            |
            <a th:href="@{/categories/{id}/delete(id=${category.id})}">Löschen</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
