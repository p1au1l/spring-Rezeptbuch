<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Kategorien')}"></head>
<body>
<div class="container py-4 py-lg-5">
    <div th:replace="~{fragments/layout :: siteHeader('Kategorien')}"></div>
    <div th:replace="~{fragments/layout :: flashMessages(${successMessage}, ${errorMessage})}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <p class="text-muted mb-0">Organisiere deine Rezepte in übersichtlichen Kategorien.</p>
        <a class="btn btn-success" th:href="@{/categories/new}">Neue Kategorie anlegen</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Beschreibung</th>
                    <th class="text-end">Aktionen</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="4" class="text-center text-muted py-5">Es sind noch keine Kategorien vorhanden.</td>
                </tr>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}" class="fw-semibold"></td>
                    <td class="fw-semibold" th:text="${category.name}"></td>
                    <td th:text="${category.description ?: 'Keine Beschreibung'}"></td>
                    <td class="text-end">
                        <div class="btn-group btn-group-sm" role="group">
                            <a class="btn btn-outline-primary" th:href="@{/categories/{id}(id=${category.id})}">Details</a>
                            <a class="btn btn-outline-secondary" th:href="@{/categories/{id}/edit(id=${category.id})}">Bearbeiten</a>
                            <a class="btn btn-outline-danger" th:href="@{/categories/{id}/delete(id=${category.id})}">Löschen</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
