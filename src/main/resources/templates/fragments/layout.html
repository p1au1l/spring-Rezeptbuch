<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="pageHead(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' - Rezeptbuch'">Rezeptbuch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:fragment="siteHeader(pageTitle)" class="mb-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm rounded-4 px-3 py-3">
        <div class="container-fluid px-0">
            <a class="navbar-brand fw-semibold" th:href="@{/}">Rezeptbuch</a>
            <div class="navbar-nav flex-row flex-wrap gap-2 ms-auto">
                <a class="nav-link text-white" th:href="@{/}">Start</a>
                <a class="nav-link text-white" th:href="@{/categories}">Kategorien</a>
                <a class="nav-link text-white" th:href="@{/recipes}">Rezepte</a>
            </div>
        </div>
    </nav>

    <div class="page-hero mt-4 p-4 p-md-5 rounded-4 bg-white border shadow-sm">
        <p class="text-uppercase text-success fw-semibold small mb-2">Digitales Kochbuch</p>
        <h1 class="display-6 fw-bold mb-0" th:text="${pageTitle}">Seite</h1>
    </div>
</header>

<div th:fragment="flashMessages(successMessage, errorMessage)" class="mb-4">
    <div th:if="${successMessage}" class="alert alert-success shadow-sm" role="alert">
        <span th:text="${successMessage}">Erfolg</span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger shadow-sm" role="alert">
        <span th:text="${errorMessage}">Fehler</span>
    </div>
</div>
</body>
</html>
