<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rezept löschen</title>
</head>
<body>
<div th:replace="~{fragments/layout :: siteHeader('Rezept löschen')}"></div>

<p>Wirklich löschen?</p>
<p>
    Das Rezept <strong th:text="${recipe.title}"></strong> (ID: <span th:text="${recipe.id}"></span>)
    wird dauerhaft gelöscht.
</p>

<form th:action="@{/recipes/{id}/delete(id=${recipe.id})}" method="post">
    <button type="submit">Ja, endgültig löschen</button>
    <a th:href="@{/recipes/{id}(id=${recipe.id})}">Nein, abbrechen</a>
</form>
</body>
</html>
