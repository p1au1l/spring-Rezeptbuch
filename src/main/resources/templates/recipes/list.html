<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rezepte</title>
</head>
<body>
<div th:replace="~{fragments/layout :: siteHeader('Rezepte')}"></div>
<div th:replace="~{fragments/layout :: flashMessages(${successMessage}, ${errorMessage})}"></div>

<p>
    <a th:href="@{/recipes/new}">Neues Rezept anlegen</a>
</p>

<table border="1" cellpadding="6" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Titel</th>
        <th>Kategorie</th>
        <th>Bewertung</th>
        <th>Aktionen</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(recipes)}">
        <td colspan="5">Es sind noch keine Rezepte vorhanden.</td>
    </tr>
    <tr th:each="recipe : ${recipes}">
        <td th:text="${recipe.id}"></td>
        <td th:text="${recipe.title}"></td>
        <td th:text="${recipe.category != null ? recipe.category.name : '-'}"></td>
        <td th:text="${recipe.rating}"></td>
        <td>
            <a th:href="@{/recipes/{id}(id=${recipe.id})}">Details</a>
            |
            <a th:href="@{/recipes/{id}/edit(id=${recipe.id})}">Bearbeiten</a>
            |
            <a th:href="@{/recipes/{id}/delete(id=${recipe.id})}">Löschen</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
